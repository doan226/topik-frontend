# BỐI CẢNH DỰ ÁN
- Tên: TOPIK AI Frontend.
- Stack: ReactJS (Vite), JavaScript.
- Chức năng chính: Giao diện thi trắc nghiệm/viết, đồng hồ Timer, lưới OMR, quét mã QR thanh toán Casso.

# QUY TẮC PHẢN HỒI (TỐI ƯU TOKEN)
- CẤM nói dài dòng, chào hỏi hay giải thích lý thuyết. Đi thẳng vào giải pháp.
- Chỉ in ra ĐÚNG đoạn code cần sửa hoặc hàm mới. Tuyệt đối KHÔNG in lại toàn bộ file (trừ khi có yêu cầu).

# QUY TẮC VIẾT CODE FRONTEND (REACT)
- BẢO TỒN CODE (Quan trọng nhất): Tuyệt đối không tự ý xóa các logic cũ (như cổng VNPay) hay các component đang chạy khi thêm tính năng mới.
- Styling: Ưu tiên sử dụng inline-style để giữ tính nhất quán với code hiện tại.
- Logic & API: Dùng Functional Components và React Hooks. Mọi thao tác gọi API Backend (fetch) đều phải bọc trong try-catch-finally, xử lý trạng thái loading và có thông báo lỗi (alert) rõ ràng cho UI/UX.