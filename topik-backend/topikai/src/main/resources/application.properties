spring.application.name=topikai

# Port: dat bien moi truong PORT=8081 neu 8080 da bi chiem (hoac dung scripts/run-backend.ps1)
server.port=${PORT:8080}

# ==========================================
# CẤU HÌNH DATABASE (Tự động thích ứng Local & Render)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/topik_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:topik-dev-jwt-secret-change-in-production-min-32-chars}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Casso webhook secure-token
casso.secure-token=${CASSO_SECURE_TOKEN:}

# ==========================================
# CẤU HÌNH GEMINI API
# ==========================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}

# ------------------------------------------
# THROTTLE / TRẦN GỌI GEMINI (chống nghẽn khi nhiều người chấm cùng lúc)
# ------------------------------------------
# TRẦN: số lời gọi Gemini song song tối đa. Nâng gói Gemini -> chỉ cần tăng biến này (env GEMINI_MAX_CONCURRENT).
gemini.max-concurrent=${GEMINI_MAX_CONCURRENT:5}
# Thời gian tối đa chờ "vé" gọi Gemini trước khi báo bận (ms).
gemini.acquire-timeout-ms=${GEMINI_ACQUIRE_TIMEOUT_MS:8000}
# Timeout kết nối / chờ phản hồi từ Gemini (ms) — tránh treo thread vô hạn.
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}
# Số lần thử lại tối đa mỗi model + backoff (ms).
gemini.max-retries=${GEMINI_MAX_RETRIES:3}
gemini.retry-initial-ms=${GEMINI_RETRY_INITIAL_MS:2000}
gemini.retry-max-ms=${GEMINI_RETRY_MAX_MS:8000}

# Admin API (sinh/upsert đề — header X-Admin-Key)
admin.api.key=${ADMIN_API_KEY:dev-admin-key}

# ==========================================
# CẤU HÌNH GIỚI HẠN KẾT NỐI CHO DATABASE FREE
# ==========================================
# Số kết nối tối đa (mặc định 3 cho DB free giới hạn 5; có thể nâng qua env DB_POOL_SIZE khi DB cho phép)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
# Số lượng kết nối tối thiểu luôn giữ trạng thái chờ
spring.datasource.hikari.minimum-idle=1
# Tự động đóng kết nối nếu không ai dùng trong 10 giây (giải phóng tài nguyên)
spring.datasource.hikari.idle-timeout=30000
# Vong doi ket noi (ms) — phai lon hon idle-timeout de tranh canh bao Hikari
spring.datasource.hikari.max-lifetime=600000

# ==========================================
# CẤU HÌNH GỬI MAIL BREVO API (MỚI)
# ==========================================
# Render sẽ tự động bơm giá trị từ mục Environment vào đây
# ==========================================
# CẤU HÌNH GỬI MAIL BREVO API (MỚI)
# ==========================================
# SỬA LẠI THÀNH CÚ PHÁP CÓ DẤU HAI CHẤM (:) VÀ GIÁ TRỊ TẠM THỜI ĐỂ TRÁNH LỖI NULL
brevo.api.key=${BREVO_API_KEY:tam_thoi_de_trong}
brevo.sender.email=${BREVO_SENDER_EMAIL:tam_thoi@gmail.com}

# ==========================================
# CẤU HÌNH VNPAY
# ==========================================
vnpay.tmncode=${VNPAY_TMN_CODE:}
vnpay.hashsecret=${VNPAY_HASH_SECRET:}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnurl=https://topik-frontend-red.vercel.app/payment-success

# SQLite dictionary (read-only lookup for interactive reading)
dictionary.sqlite.path=data/dictionary.db

# Tài khoản test A/A1 (password=1) — chỉ bật local/dev
seed.test-users=${SEED_TEST_USERS:false}